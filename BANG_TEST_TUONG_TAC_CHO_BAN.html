<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BẢNG TEST 25 TÍNH NĂNG AI HAVEN — DÀNH CHO BẠN CÙNG NHÓM (RTX 3060)</title>
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --haven-lime: #9FE870;
      --haven-forest: #163300;
      --haven-forest-deep: #0E1B00;
      --haven-bg: #F2F5F0;
      --haven-surface: #FFFFFF;
      --haven-border: rgba(22, 51, 0, 0.12);
      --haven-text: #163300;
      --haven-text-subtle: #495E35;
      --danger: #E11D48;
      --danger-bg: #FFE4E6;
      --warning: #D97706;
      --warning-bg: #FEF3C7;
      --success: #15803D;
      --success-bg: #DCFCE7;
    }

    [data-theme="dark"] {
      --haven-bg: #0A1202;
      --haven-surface: #121F08;
      --haven-border: rgba(159, 232, 112, 0.18);
      --haven-text: #F1F5F9;
      --haven-text-subtle: #A3B899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--haven-bg);
      color: var(--haven-text);
      line-height: 1.5;
      padding: 24px;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: var(--haven-surface);
      border: 1px solid var(--haven-border);
      border-radius: 28px;
      padding: 28px 32px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      background: var(--haven-lime);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      color: var(--haven-forest);
      box-shadow: 0 4px 12px rgba(159, 232, 112, 0.4);
    }

    .brand-text h1 {
      font-size: 24px;
      font-weight: 900;
      color: var(--haven-text);
      letter-spacing: -0.02em;
    }

    .brand-text p {
      font-size: 13px;
      color: var(--haven-text-subtle);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--haven-lime);
      color: var(--haven-forest);
      box-shadow: 0 2px 8px rgba(159, 232, 112, 0.35);
    }

    .btn-secondary {
      background: var(--haven-forest);
      color: #FFFFFF;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--haven-border);
      color: var(--haven-text);
    }

    .btn-outline:hover {
      background: rgba(159, 232, 112, 0.15);
    }

    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      padding-top: 20px;
      border-top: 1px solid var(--haven-border);
    }

    .metric-card {
      background: rgba(159, 232, 112, 0.08);
      border: 1px solid var(--haven-border);
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--haven-text-subtle);
    }

    .metric-value {
      font-size: 28px;
      font-weight: 900;
      color: var(--haven-text);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .metric-value small {
      font-size: 13px;
      font-weight: 700;
      color: var(--haven-text-subtle);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(0,0,0,0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      background: var(--haven-lime);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--haven-border);
      background: var(--haven-surface);
      color: var(--haven-text-subtle);
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--haven-forest);
      color: var(--haven-lime);
      border-color: var(--haven-forest);
    }

    .test-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .test-card {
      background: var(--haven-surface);
      border: 1px solid var(--haven-border);
      border-radius: 24px;
      padding: 24px 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.02);
      transition: border-color 0.2s;
    }

    .test-card:hover {
      border-color: rgba(159, 232, 112, 0.6);
    }

    .test-card.status-pass {
      border-left: 6px solid var(--success);
    }

    .test-card.status-fail {
      border-left: 6px solid var(--danger);
    }

    .test-card.status-pending {
      border-left: 6px solid var(--warning);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
    }

    .card-id-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge-id {
      font-family: monospace;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--haven-forest);
      color: var(--haven-lime);
    }

    .badge-category {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(159, 232, 112, 0.18);
      color: var(--haven-forest);
    }

    [data-theme="dark"] .badge-category {
      color: var(--haven-lime);
    }

    .test-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--haven-text);
      margin-top: 4px;
    }

    .test-location {
      font-size: 12px;
      color: var(--haven-text-subtle);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .status-selector {
      display: inline-flex;
      background: rgba(0,0,0,0.04);
      padding: 4px;
      border-radius: 999px;
      gap: 4px;
    }

    .status-btn {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--haven-text-subtle);
      transition: all 0.15s ease;
    }

    .status-btn.active.pass {
      background: var(--success);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(21, 128, 61, 0.35);
    }

    .status-btn.active.fail {
      background: var(--danger);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(225, 29, 72, 0.35);
    }

    .status-btn.active.pending {
      background: var(--warning);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(217, 119, 6, 0.35);
    }

    .prompt-box {
      background: rgba(159, 232, 112, 0.1);
      border: 1px dashed rgba(159, 232, 112, 0.5);
      border-radius: 14px;
      padding: 12px 16px;
      margin: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .prompt-text {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--haven-text);
      word-break: break-word;
    }

    .copy-btn {
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--haven-forest);
      color: var(--haven-lime);
      border: none;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      opacity: 0.9;
    }

    .criteria-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin: 12px 0;
    }

    .criteria-box {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.45;
    }

    .criteria-pass {
      background: var(--success-bg);
      border: 1px solid rgba(21, 128, 61, 0.2);
      color: var(--success);
    }

    .criteria-fail {
      background: var(--danger-bg);
      border: 1px solid rgba(225, 29, 72, 0.2);
      color: var(--danger);
    }

    .criteria-label {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .notes-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--haven-border);
      background: var(--haven-bg);
      color: var(--haven-text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      margin-top: 8px;
      transition: border-color 0.2s;
    }

    .notes-input:focus {
      border-color: var(--haven-lime);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--haven-forest);
      color: var(--haven-lime);
      padding: 12px 20px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Header Banner -->
  <header>
    <div class="header-top">
      <div class="brand-title">
        <div class="brand-logo">🌿</div>
        <div class="brand-text">
          <h1>HAVEN AI — BẢNG TEST 25 TÍNH NĂNG TOÀN DIỆN</h1>
          <p>Dành riêng cho bạn cùng nhóm chạy trên máy tính Windows (RTX 3060 6GB VRAM)</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="themeToggle" class="btn btn-outline" title="Chuyển chế độ sáng/tối">🌓 Giao Diện</button>
        <button id="exportCsvBtn" class="btn btn-primary" title="Tải xuống tệp Excel CSV mới nhất">📥 Xuất File Excel (.CSV)</button>
        <button id="copyBugReportBtn" class="btn btn-secondary" title="Sao chép báo cáo lỗi dạng văn bản gửi cho Sơn">📋 Copy Báo Cáo Lỗi</button>
        <button id="resetProgressBtn" class="btn btn-outline" style="color: var(--danger);" title="Đặt lại trạng thái test">↺ Reset Tiến Độ</button>
      </div>
    </div>

    <!-- Live Counters & Progress Bar -->
    <div class="metrics-bar">
      <div class="metric-card">
        <span class="metric-label">Tổng Số Ca Kiểm Thử</span>
        <div class="metric-value">25 <small>Test Cases</small></div>
      </div>

      <div class="metric-card" style="background: rgba(21, 128, 61, 0.08);">
        <span class="metric-label" style="color: var(--success);">Số Ca Đạt (Pass)</span>
        <div class="metric-value" style="color: var(--success);" id="countPass">0 <small>/ 25</small></div>
      </div>

      <div class="metric-card" style="background: rgba(225, 29, 72, 0.08);">
        <span class="metric-label" style="color: var(--danger);">Số Ca Bị Lỗi (Fail)</span>
        <div class="metric-value" style="color: var(--danger);" id="countFail">0 <small>/ 25</small></div>
      </div>

      <div class="metric-card" style="background: rgba(217, 119, 6, 0.08);">
        <span class="metric-label" style="color: var(--warning);">Tiến Độ Hoàn Thành</span>
        <div class="metric-value" style="color: var(--warning);" id="progressPercent">0%</div>
        <div class="progress-track">
          <div class="progress-fill" id="progressBar" style="width: 0%;"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Filter & Navigation Tabs -->
  <div class="filter-bar">
    <div class="tabs" id="filterTabs">
      <button class="tab-btn active" data-filter="all">Tất Cả (25)</button>
      <button class="tab-btn" data-filter="pass">Đạt ✅</button>
      <button class="tab-btn" data-filter="fail">Lỗi ❌</button>
      <button class="tab-btn" data-filter="pending">Chưa Test ⏳</button>
      <button class="tab-btn" data-filter="Phase 1">Phase 1 (Search & Actions)</button>
      <button class="tab-btn" data-filter="Phase 2">Phase 2 (OCR & Forms)</button>
      <button class="tab-btn" data-filter="Phase 3">Phase 3 (Admin Ops)</button>
      <button class="tab-btn" data-filter="Phase 4">Phase 4 (Signature AI)</button>
    </div>
  </div>

  <!-- Test Cases Interactive Cards List -->
  <div class="test-list" id="testCaseList">
    <!-- Rendered dynamically via JavaScript from testCasesData -->
  </div>
</div>

<div class="toast" id="toast">Đã sao chép prompt vào bộ nhớ tạm!</div>

// State persistence via localStorage
const STORAGE_KEY = 'haven_qa_suite_v2';
let testState = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

// Initialize state if empty
testCasesData.forEach(tc => {
  if (!testState[tc.id]) {
    testState[tc.id] = {
      status: 'pending', // 'pass' | 'fail' | 'pending'
      notes: ''
    };
  }
});

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(testState));
  updateMetrics();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function copyToClipboard(text, successMsg = 'Đã sao chép prompt vào bộ nhớ tạm!') {
  navigator.clipboard.writeText(text).then(() => {
    showToast(successMsg);
  });
}

function updateMetrics() {
  let pass = 0;
  let fail = 0;
  let pending = 0;

  testCasesData.forEach(tc => {
    const s = testState[tc.id]?.status || 'pending';
    if (s === 'pass') pass++;
    else if (s === 'fail') fail++;
    else pending++;
  });

  document.getElementById('countPass').innerHTML = `${pass} <small>/ 25</small>`;
  document.getElementById('countFail').innerHTML = `${fail} <small>/ 25</small>`;
  
  const pct = Math.round(((pass + fail) / 25) * 100);
  document.getElementById('progressPercent').textContent = `${pct}%`;
  document.getElementById('progressBar').style.width = `${pct}%`;
}

let activeFilter = 'all';

function renderCards() {
  const container = document.getElementById('testCaseList');
  container.innerHTML = '';

  const filtered = testCasesData.filter(tc => {
    const state = testState[tc.id] || { status: 'pending' };
    if (activeFilter === 'all') return true;
    if (activeFilter === 'pass') return state.status === 'pass';
    if (activeFilter === 'fail') return state.status === 'fail';
    if (activeFilter === 'pending') return state.status === 'pending';
    if (activeFilter.startsWith('Phase')) return tc.phase === activeFilter;
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = `<div style="text-align: center; padding: 48px; color: var(--haven-text-subtle); font-weight: 700;">Không có ca test nào trong bộ lọc này!</div>`;
    return;
  }

  filtered.forEach(tc => {
    const state = testState[tc.id] || { status: 'pending', notes: '' };
    const card = document.createElement('div');
    card.className = `test-card status-${state.status}`;
    card.id = `card-${tc.id}`;

    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-id-group">
            <span class="badge-id">${tc.id}</span>
            <span class="badge-category">${tc.category}</span>
          </div>
          <h2 class="test-title">${tc.title}</h2>
          <div class="test-location">📍 <strong>Vị trí:</strong> ${tc.location}</div>
        </div>

        <div class="status-selector">
          <button class="status-btn pass ${state.status === 'pass' ? 'active pass' : ''}" onclick="setStatus('${tc.id}', 'pass')">ĐẠT ✅</button>
          <button class="status-btn fail ${state.status === 'fail' ? 'active fail' : ''}" onclick="setStatus('${tc.id}', 'fail')">LỖI ❌</button>
          <button class="status-btn pending ${state.status === 'pending' ? 'active pending' : ''}" onclick="setStatus('${tc.id}', 'pending')">CHƯA TEST ⏳</button>
        </div>
      </div>

      <div class="prompt-box">
        <div class="prompt-text"><strong>Thao Tác / Câu Prompt Cần Nhập:</strong> "${tc.prompt}"</div>
        <button class="copy-btn" onclick="copyToClipboard('${tc.prompt.replace(/'/g, "\\'")}', 'Đã copy câu prompt!')">📋 Sao Chép Prompt</button>
      </div>

      <div class="criteria-grid">
        <div class="criteria-box criteria-pass">
          <span class="criteria-label">✅ ĐIỀU KIỆN ĐẠT (PASS CRITERIA)</span>
          ${tc.passCriteria}
        </div>
        <div class="criteria-box criteria-fail">
          <span class="criteria-label">❌ ĐIỀU KIỆN KHÔNG ĐẠT (FAIL CRITERIA)</span>
          ${tc.failCriteria}
        </div>
      </div>

      <div>
        <input 
          type="text" 
          class="notes-input" 
          placeholder="Nhập ghi chú lỗi hoặc quan sát thực tế tại đây (tự động lưu)..." 
          value="${state.notes ? state.notes.replace(/"/g, '&quot;') : ''}"
          oninput="updateNotes('${tc.id}', this.value)"
        />
      </div>
    `;

    container.appendChild(card);
  });
}

window.setStatus = function(id, status) {
  if (!testState[id]) testState[id] = { status: 'pending', notes: '' };
  testState[id].status = status;
  saveState();
  renderCards();
};

window.updateNotes = function(id, val) {
  if (!testState[id]) testState[id] = { status: 'pending', notes: '' };
  testState[id].notes = val;
  saveState();
};

// Filter tabs
document.getElementById('filterTabs').addEventListener('click', (e) => {
  if (e.target.classList.contains('tab-btn')) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    activeFilter = e.target.getAttribute('data-filter');
    renderCards();
  }
});

// Theme toggle
document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('haven_qa_theme', next);
});

// Load saved theme
if (localStorage.getItem('haven_qa_theme') === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
}

// Reset Progress
document.getElementById('resetProgressBtn').addEventListener('click', () => {
  if (confirm('Bạn có chắc muốn đặt lại toàn bộ trạng thái 25 ca test về "CHƯA TEST"?')) {
    testCasesData.forEach(tc => {
      testState[tc.id] = { status: 'pending', notes: '' };
    });
    saveState();
    renderCards();
    showToast('Đã đặt lại tiến độ về mặc định!');
  }
});

// Copy Bug Report
document.getElementById('copyBugReportBtn').addEventListener('click', () => {
  let report = `# BÁO CÁO KIỂM THỬ HAVEN AI (RTX 3060)\n`;
  report += `Thời gian xuất: ${new Date().toLocaleString('vi-VN')}\n\n`;

  let passCount = 0, failCount = 0, pendingCount = 0;
  let failedCases = [];

  testCasesData.forEach(tc => {
    const s = testState[tc.id] || { status: 'pending', notes: '' };
    if (s.status === 'pass') passCount++;
    else if (s.status === 'fail') {
      failCount++;
      failedCases.push({ ...tc, notes: s.notes });
    } else pendingCount++;
  });

  report += `## TỔNG QUAN KẾT QUẢ:\n- Tổng số: 25\n- Đạt ✅: ${passCount}\n- Lỗi ❌: ${failCount}\n- Chưa test ⏳: ${pendingCount}\n\n`;

  if (failedCases.length > 0) {
    report += `## CHI TIẾT CÁC CA BỊ LỖI (${failedCases.length} CA):\n`;
    failedCases.forEach((fc, i) => {
      report += `${i + 1}. [${fc.id}] ${fc.title}\n`;
      report += `   - Vị trí: ${fc.location}\n`;
      report += `   - Prompt test: "${fc.prompt}"\n`;
      report += `   - Ghi chú lỗi thực tế: ${fc.notes || 'Chưa ghi chú'}\n\n`;
    });
  } else {
    report += `🎉 KHÔNG CÓ LỖI NÀO! Tất cả các ca đã test đều ĐẠT chuẩn.\n`;
  }

  copyToClipboard(report, 'Đã sao chép Báo cáo lỗi Markdown! Hãy dán gửi cho Sơn.');
});

// Export CSV with UTF-8 BOM
document.getElementById('exportCsvBtn').addEventListener('click', () => {
  let csvContent = '\uFEFF"Mã Test (ID)","Nhóm Tính Năng","Tên Chức Năng","Màn Hình / Vị Trí Trên App","Thao Tác & Câu Prompt Cần Nhập (Copy-Paste)","Điều Kiện ĐẠT (Pass Criteria)","Điều Kiện KHÔNG ĐẠT (Fail Criteria)","Kết Quả (Đạt / Lỗi)","Ghi Chú Lỗi Chi Tiết"\n';

  testCasesData.forEach(tc => {
    const s = testState[tc.id] || { status: 'pending', notes: '' };
    const statusLabel = s.status === 'pass' ? 'Đạt' : s.status === 'fail' ? 'Lỗi' : 'Chưa test';
    
    const escapeCsv = (str) => `"${(str || '').replace(/"/g, '""')}"`;

    csvContent += [
      escapeCsv(tc.id),
      escapeCsv(tc.category),
      escapeCsv(tc.title),
      escapeCsv(tc.location),
      escapeCsv(tc.prompt),
      escapeCsv(tc.passCriteria),
      escapeCsv(tc.failCriteria),
      escapeCsv(statusLabel),
      escapeCsv(s.notes)
    ].join(',') + '\n';
  });

  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `BANG_TEST_25_TINH_NANG_AI_HAVEN_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Đã tải xuống file CSV kết quả!');
});

// Initial run
updateMetrics();
renderCards();
</script>
